<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Second Chance Careers{% endblock %}</title>
  <link rel="canonical" href="{{ second_chance_url }}">
  <style>
    :root {
      --sc-teal: #0f6f6b;
      --sc-teal-dark: #0b5f5c;
      --sc-mint: #d9f0eb;
      --sc-cream: #f2ffa8;
      --sc-text: #071514;
      --sc-muted: #57706c;
      --sc-card: rgba(246, 255, 252, 0.88);
      --sc-line: rgba(4, 69, 67, 0.14);
      --sc-shadow: 0 18px 44px rgba(1, 41, 39, 0.14);
      --sc-lift: 0 10px 24px rgba(5, 55, 52, 0.10);
      --sc-lift-strong: 0 18px 38px rgba(5, 55, 52, 0.16);
      --sc-radius: 18px;
      --sc-radius-sm: 14px;
      --sc-ease: 180ms ease;
      --sc-max: 1180px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--sc-text);
      background: var(--sc-mint);
      font-family: "Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    input, button { font: inherit; }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(242, 255, 168, 0.9);
      outline-offset: 3px;
    }

    .sc-page {
      width: min(100%, var(--sc-max));
      min-height: 100vh;
      margin: 0 auto;
      background: var(--sc-mint);
      box-shadow: 0 0 0 1px rgba(7, 21, 20, 0.04);
      overflow: hidden;
    }

    .sc-top {
      position: sticky;
      top: 0;
      z-index: 30;
      min-height: 86px;
      display: grid;
      grid-template-columns: 120px 1fr 76px;
      align-items: center;
      background: var(--sc-teal);
      color: var(--sc-cream);
      box-shadow: 0 6px 18px rgba(1, 41, 39, 0.16);
      backdrop-filter: blur(18px);
    }

    .sc-logo {
      height: 86px;
      background: url("{{ url_for('static', filename='second_chance/logo-crop.png') }}") center / cover no-repeat;
    }

    .sc-brand {
      justify-self: center;
      font-size: clamp(2rem, 6vw, 3.15rem);
      line-height: 1.05;
      letter-spacing: 0.03em;
      font-weight: 400;
      text-align: center;
      transition: opacity var(--sc-ease);
    }

    .sc-brand:hover,
    .sc-desktop-signup:hover {
      opacity: 0.82;
    }

    .sc-menu {
      justify-self: center;
      width: 54px;
      height: 48px;
      border: 0;
      background: transparent;
      display: grid;
      align-content: center;
      gap: 9px;
      cursor: pointer;
    }

    .sc-menu span {
      display: block;
      height: 1px;
      background: rgba(0, 0, 0, 0.76);
    }

    .sc-desktop-signup {
      display: none;
      justify-self: end;
      margin-right: 1.4rem;
      color: var(--sc-cream);
      font-size: 1.55rem;
      letter-spacing: 0.07em;
    }

    .sc-main { padding-bottom: 82px; }

    .sc-band {
      background: var(--sc-teal);
      color: var(--sc-cream);
      text-align: center;
      font-size: clamp(2.2rem, 11vw, 3.4rem);
      line-height: 1.05;
      padding: 0.55rem 1rem;
      font-weight: 400;
    }

    .sc-button {
      min-height: 34px;
      min-width: 168px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      padding: 0.28rem 1.2rem;
      border: 0;
      border-radius: 999px;
      background: var(--sc-teal);
      color: var(--sc-cream);
      font-size: 0.96rem;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(5, 55, 52, 0.12);
      transition: transform var(--sc-ease), background var(--sc-ease), box-shadow var(--sc-ease), opacity var(--sc-ease);
    }

    .sc-button:hover {
      transform: translateY(-2px);
      background: var(--sc-teal-dark);
      box-shadow: 0 12px 26px rgba(5, 55, 52, 0.18);
    }

    .sc-button:active {
      transform: translateY(0);
      box-shadow: 0 6px 14px rgba(5, 55, 52, 0.12);
    }
    .sc-button .plus { font-size: 1.8rem; line-height: 0; font-weight: 300; }

    .sc-bottom {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 35;
      width: min(100%, 428px);
      min-height: 70px;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      background: var(--sc-teal);
      color: var(--sc-cream);
      box-shadow: 0 -12px 30px rgba(1, 41, 39, 0.14);
    }

    .sc-bottom a {
      min-height: 70px;
      display: grid;
      place-items: center;
      font-size: 2.4rem;
      line-height: 1;
    }

    .sc-bottom .active {
      width: 62px;
      min-height: 62px;
      justify-self: center;
      border-radius: 50%;
      background: var(--sc-cream);
      color: var(--sc-text);
      box-shadow: 0 8px 18px rgba(1, 41, 39, 0.16);
    }

    .sc-flashes {
      display: grid;
      gap: 0.5rem;
      padding: 0.75rem 1rem 0;
    }

    .sc-flash {
      padding: 0.8rem 1rem;
      border-radius: 16px;
      background: rgba(242, 255, 168, 0.7);
      color: var(--sc-teal-dark);
      font-weight: 800;
    }

    @media (min-width: 760px) {
      body { background: linear-gradient(180deg, #effaf5, var(--sc-mint)); }

      .sc-page {
        width: min(var(--sc-max), calc(100% - 2rem));
      }

      .sc-top {
        grid-template-columns: 340px 1fr 220px;
        min-height: 112px;
      }

      .sc-logo {
        height: 112px;
        background-size: cover;
      }

      .sc-brand {
        font-size: clamp(2.3rem, 4vw, 4.1rem);
        letter-spacing: 0.06em;
      }

      .sc-menu { display: none; }
      .sc-desktop-signup { display: block; }
      .sc-bottom { display: none; }
      .sc-main { padding-bottom: 0; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="sc-page">
    <header class="sc-top">
      <a class="sc-logo" href="{{ url_for('second_chance_home') }}" aria-label="Second Chance Careers home"></a>
      <a class="sc-brand" href="{{ url_for('second_chance_home') }}">Second Chance Careers</a>
      <a class="sc-desktop-signup" href="{{ url_for('second_chance_my_path') }}">My Path</a>
      <button class="sc-menu" type="button" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </header>

    <main class="sc-main">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="sc-flashes">
            {% for message in messages %}
              <div class="sc-flash">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>

    <nav class="sc-bottom" aria-label="Second Chance navigation">
      <a href="{{ url_for('second_chance_search') }}" aria-label="Search">‹</a>
      <a href="{{ url_for('second_chance_profile') }}" aria-label="Profile">♙</a>
      <a class="active" href="{{ url_for('second_chance_my_path') }}" aria-label="My Path">⌂</a>
    </nav>
  </div>
</body>
</html>
