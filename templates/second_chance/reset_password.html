{% extends "second_chance/base.html" %}

{% block title %}Choose New Password | Second Chance Careers{% endblock %}

{% block head %}
<style>
  .reset-panel {
    background: var(--sc-cream);
    padding: 1.2rem 1.55rem 5rem;
  }

  .reset-panel p {
    margin: 0.25rem 0 1rem;
    color: #566c69;
    text-align: center;
    letter-spacing: 0.03em;
  }

  .reset-form {
    display: grid;
    gap: 1.25rem;
  }

  .sc-field {
    min-height: 72px;
    display: grid;
    grid-template-columns: 34px 1fr;
    align-items: center;
    gap: 0.7rem;
    padding: 0 1rem;
    border-radius: 10px;
    background: rgba(246, 255, 252, 0.92);
    color: #144a39;
    box-shadow: 0 8px 18px rgba(5, 55, 52, 0.08);
  }

  .sc-field span {
    font-size: 1.25rem;
    text-align: center;
  }

  .sc-field input {
    width: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: #144a39;
  }

  .reset-submit {
    min-height: 58px;
    width: 100%;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 500;
  }

  @media (min-width: 760px) {
    .reset-panel {
      max-width: 640px;
      margin: 0 auto;
      padding: 1.5rem 2rem 4rem;
      border-radius: 0 0 28px 28px;
      box-shadow: var(--sc-shadow);
    }
  }
</style>
{% endblock %}

{% block content %}
<div class="sc-band">New Password</div>

<section class="reset-panel">
  <p>Choose a new password for {{ email }}.</p>
  <form class="reset-form" method="POST">
    <label class="sc-field">
      <span>▣</span>
      <input name="password" type="password" placeholder="New password" required>
    </label>

    <label class="sc-field">
      <span>▣</span>
      <input name="confirm_password" type="password" placeholder="Confirm new password" required>
    </label>

    <button class="sc-button reset-submit" type="submit">Reset Password</button>
  </form>
</section>
{% endblock %}
