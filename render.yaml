services:
  - type: web
    name: second-chance-careers
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    disk:
      name: second-chance-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/second_chance.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: BRENT_SSO_URL
        value: https://www.brentandco.org/sso/start
      - key: SSO_SHARED_SECRET
        sync: false
      - key: SSO_TOKEN_TTL_SECONDS
        value: "900"
      - key: SSO_CLOCK_SKEW_SECONDS
        value: "120"
      - key: SSO_ACCEPTED_ISSUERS
        value: brent-co-identity,brent-co-sso
      - key: SSO_AUDIENCE
        value: second-chance
      - key: DEBUG_SSO
        value: "0"
